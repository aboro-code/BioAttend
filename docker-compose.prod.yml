# Full stack for a public server (Oracle Free Tier, etc.).
# Keeps your existing docker-compose.yml for local DB+MinIO only.
#
# On the VM:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Open port 80 in the cloud firewall. Do not expose Postgres/MinIO publicly.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: face_recognition
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d face_recognition"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    command:
      - /bin/sh
      - -c
      - "sleep 10 && mc alias set local http://minio:9000 minioadmin minioadminpassword && mc mb local/student-photos --ignore-existing"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: face_recognition
      DB_USER: admin
      DB_PASSWORD: password123
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: student-photos
      MINIO_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - insightface_models:/root/.insightface
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data:
  insightface_models:
